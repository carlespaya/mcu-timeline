:root[data-theme="dark"]{--bg1:#0a0b14;--bg2:#1a0b12;--tx:#f5f5fa;--mut:#aab0c4;--gl:rgba(255,255,255,.07);--gb:rgba(255,255,255,.18);--sh:rgba(0,0,0,.5);--chip:rgba(255,255,255,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--tx);font:400 16px/1.4 Oswald,'Arial Narrow',sans-serif;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;pointer-events:none}

main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.glass{background:var(--gl);border:1px solid var(--gb);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);box-shadow:0 10px 36px var(--sh),inset 0 1px 0 var(--gb);border-radius:22px}

.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:26px 28px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0;padding:12px 14px}
.tabs{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.tab,.chip{border:1px solid var(--gb);background:var(--chip);border-radius:999px;padding:6px 16px;font:400 20px 'Bebas Neue',Anton,sans-serif;letter-spacing:.04em;transition:.2s}
.tab[aria-pressed=true]{background:#ec1d24;color:#fff;border-color:transparent;box-shadow:0 4px 18px rgba(236,29,36,.5)}

.prog{display:flex;align-items:center;gap:14px;padding:12px 18px;margin-bottom:16px}
.meter{flex:1;height:12px;border-radius:9px;background:var(--chip);overflow:hidden;border:1px solid var(--gb)}
.meter div{height:100%;width:0;background:linear-gradient(90deg,#ec1d24,#ffd400);transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;padding:16px 16px 14px 22px;display:flex;flex-direction:column;gap:4px;overflow:hidden;transition:transform .2s,opacity .2s}

.card:hover{transform:translateY(-3px)}
.card.seen{opacity:.5}.card.seen h3{text-decoration:line-through}
.meta{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:14px}

.b2{background:#ec1d24;color:#fff}.b1{background:#ffd400;color:#14151c}

.seen .ck{background:#3fae4a;border-color:#3fae4a;color:#fff}
.ph{margin:26px 4px 12px;display:flex;align-items:baseline;gap:14px}

.step .card{padding-left:24px}.why{font-size:17px;max-width:70ch}
.final{padding:22px 26px;text-align:center;background:linear-gradient(135deg,rgba(63,174,74,.75),rgba(20,90,35,.75));color:#fff}

.legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;margin-bottom:12px}.legend p{margin:0;color:var(--mut);font-size:14px;flex:1;min-width:220px}
.mapwrap{overflow-x:auto;padding:14px;margin-bottom:14px}.map{display:grid;grid-template-columns:96px repeat(18,minmax(150px,1fr));gap:10px;min-width:max-content;align-items:start}
.mh{font-size:24px;font-weight:400;padding:2px 8px;border-left:2px solid var(--gb)}
.lane{position:sticky;left:0;z-index:2;padding:10px 12px;border-radius:14px;font-size:26px;background:var(--bg1);border:1px solid var(--gb)}
.cell{display:flex;flex-direction:column;gap:6px;padding:4px 6px;border-left:2px dashed var(--gb);min-height:46px}
.pill{border:0;text-align:left;padding:6px 11px;border-radius:12px;background:var(--c);color:#fff;font:400 14px/1.15 Oswald,sans-serif;box-shadow:0 3px 10px var(--sh);transition:.2s}
.pill:hover{transform:scale(1.04)}.pill.ess{box-shadow:0 0 0 2px var(--bg1),0 0 0 5px #ec1d24}
.pill.seen{opacity:.45;text-decoration:line-through}.pill.dim:not(.seen){opacity:.22}
.pills{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:10px}.mut p.note{margin:0}
.next{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 22px;margin-bottom:16px}.next h2{margin:2px 0;font-size:34px;font-weight:400}.next p{margin:0;color:var(--mut);max-width:60ch}
.btn{border:0;border-radius:999px;padding:10px 24px;background:#ec1d24;color:#fff;font:400 22px 'Bebas Neue',Anton,sans-serif;box-shadow:0 6px 20px rgba(236,29,36,.45)}
.svgw{overflow-x:auto;padding:14px;margin-bottom:14px}.svgw svg{display:block;min-width:860px;width:100%;height:auto}.svgw text{font-family:Oswald,sans-serif}.svgw .t{font-family:'Bebas Neue',Anton,sans-serif}
.ygg{max-width:800px;margin:0 auto}.ygg svg{display:block;width:100%;height:auto}.ygg text{font-family:Oswald,sans-serif}.ygg .t{font-family:'Bebas Neue',Anton,sans-serif}
.cap{position:sticky;top:8px;z-index:5;padding:10px 18px;margin:0 auto 12px;max-width:800px;min-height:48px;font-size:15px;color:var(--mut)}
.hv{opacity:0;fill:var(--tx);font-size:21px;paint-order:stroke;stroke:var(--bg1);stroke-width:6px;stroke-linejoin:round;pointer-events:none;transition:opacity .15s}.nd:hover .hv{opacity:1}.nd:hover path{stroke-opacity:1}
.nd{cursor:pointer}.nd .lf{filter:drop-shadow(0 0 5px var(--c));transition:.2s}.nd:hover .lf{filter:drop-shadow(0 0 12px var(--c))}.nd.seen{opacity:.3}
main{padding:12px 10px 130px}
.hero{padding:14px 16px;gap:10px;grid-template-columns:1fr auto}h1{font-size:40px}.hero p{display:none}
.cd{padding:8px 12px;border-radius:16px}.cd b{font-size:36px}.cd small{font-size:13px;display:block;max-width:76px;line-height:1}
.nav{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:6px;overflow-x:auto;padding:7px;border-radius:999px;scrollbar-width:none}
.nav .tab{white-space:nowrap;font-size:19px;padding:6px 15px;flex:0 0 auto}
.sheet{position:fixed;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:30;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}.sheet[hidden]{display:none}
.next{padding:12px 16px;margin-bottom:10px}.next h2{font-size:26px}.next p{font-size:14px}.btn{font-size:19px;padding:8px 18px}
.prog{padding:8px 14px;margin-bottom:10px}.grid{grid-template-columns:1fr}.route{padding-left:42px}.step .n{left:-42px;width:38px;height:38px}
.final b{font-size:36px}.legend{padding:10px 12px}.legend p{font-size:13px}.ph h2{font-size:28px}
#phases{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}#phases .chip{flex:0 0 auto}
.svgw svg{min-width:720px}
.yscroll{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px}.yscroll svg{display:block}.yscroll text{font-family:Oswald,sans-serif}.yscroll .t{font-family:'Bebas Neue',Anton,sans-serif}
.nd.act .hv{opacity:1}.nd.act .lf{filter:drop-shadow(0 0 14px var(--c))}.nd.act path{stroke-opacity:1}
.zm{display:flex;gap:8px;align-items:center}.zm .chip{font-size:24px;padding:2px 16px}
.empty{padding:30px;text-align:center;color:var(--mut)}
.foot{margin-top:34px;text-align:center;color:var(--mut);font-size:13px}
.tg{margin-left:auto}
@media(max-width:640px){.hero{grid-template-columns:1fr}.cd{justify-self:start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

<main>
<header class="glass hero">
  <div><h1 class="disp">MCU <span>Timeline</span></h1>
  <p>Películas, series y one-shots en orden cronológico y narrativo, con la ruta mínima para llegar a Doomsday.</p></div>

</header>
<div class="glass bar" id="sb" style="display:none"><input type="search" id="q" placeholder="Buscar título" aria-label="Buscar título"><button class="chip tg" id="hide" aria-pressed="false" style="--c:#3fae4a">Ocultar vistos</button></div>
<nav class="glass nav" role="group" aria-label="Vista"><button class="tab" data-v="ygg" aria-pressed="true">Árbol</button><button class="tab" data-v="ruta" aria-pressed="false">Ruta</button><button class="tab" data-v="map" aria-pressed="false">Mapa</button><button class="tab" data-v="graph" aria-pressed="false">Conexiones</button><button class="tab" data-v="tree" aria-pressed="false">Multiverso</button><button class="tab" data-v="tl" aria-pressed="false">Lista</button></nav>

<div id="out"></div>
<p class="foot">Fechas y orden basados en las notas del autor. Tu progreso se guarda solo en este navegador.</p>
</main>
